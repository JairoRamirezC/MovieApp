name: Iniciando flujo de trabajo
# run-name: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
run-name: 'Ejecutando hola_mundo.yml workflow'

on:
  push:
    branches:
      - feature/*
  pull_request:
    branches:
      - integration
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  greatings:
    name: Say Hello
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: Run Script
        run: node scripts/hello_word.js
  finish:
    name: Say Goodbye
    runs-on: ubuntu-latest
    needs: greatings
    steps:
      - name: Say goodbye
        run: echo "Goodbye, World!"